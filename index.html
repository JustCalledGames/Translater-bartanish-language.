<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Переводчик Бартанского языка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one narrow column. Input frame on top, translation frame below, the key table folded at the bottom. */
:root {
  --bg: #E8ECF0;
  --panel: #F8FAFB;
  --panel-2: #EDF1F5;
  --fg: #16212B;
  --muted: #586878;
  --line: #C3CCD6;
  --accent: #2B55E0;
  --on-accent: #FFFFFF;
  --font-display: 'Unbounded', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F161D;
    --panel: #16202A;
    --panel-2: #1B2733;
    --fg: #E4EAF0;
    --muted: #93A3B3;
    --line: #2E3C49;
    --accent: #7F9CFF;
    --on-accent: #0F161D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F161D;
  --panel: #16202A;
  --panel-2: #1B2733;
  --fg: #E4EAF0;
  --muted: #93A3B3;
  --line: #2E3C49;
  --accent: #7F9CFF;
  --on-accent: #0F161D;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 28px 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 42rem; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.wrap > * { min-width: 0; }

h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(1.3rem, 5vw, 1.7rem);
  line-height: 1.2;
  letter-spacing: -0.01em;
  margin: 0 0 10px;
  text-wrap: balance;
}
.progress { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.8125rem; flex-wrap: wrap; }
.segs { display: flex; gap: 4px; }
.seg { width: 28px; height: 6px; border-radius: 2px; background: var(--line); }
.seg.on { background: var(--accent); }

.field { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; min-height: 32px; }
.lab { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.status { font-size: 0.8125rem; color: var(--muted); }

.frame { border: 1.5px solid var(--line); border-radius: 6px; background: var(--panel); }
.frame:focus-within { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
textarea {
  display: block;
  width: 100%;
  min-height: 9.5rem;
  padding: 14px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--fg);
  font: 1.125rem/1.6 var(--font-mono);
  resize: vertical;
  outline: none;
}
.out {
  min-height: 9.5rem;
  padding: 14px;
  border: 1.5px solid var(--line);
  border-radius: 6px;
  background: var(--panel-2);
  color: var(--fg);
  font: 1.125rem/1.6 var(--font-mono);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.out:empty::before { content: attr(data-ph); color: var(--muted); }
.modes { display: flex; gap: 0; border: 1.5px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.mode { flex: 1; font: 500 0.9375rem var(--font-body); padding: 10px 12px; border: 0; background: transparent; color: var(--fg); cursor: pointer; }
.mode + .mode { border-left: 1.5px solid var(--line); }
.mode[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.mode:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
[hidden] { display: none !important; }
.hint { margin: 0; font-size: 0.8125rem; color: var(--muted); }

.btn {
  font: 500 0.8125rem var(--font-body);
  padding: 7px 12px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--fg);
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

details { border-top: 1px solid var(--line); padding-top: 14px; }
summary { cursor: pointer; font-weight: 600; }
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.key { display: flex; flex-direction: column; gap: 16px; margin-top: 14px; }
.key h3 { margin: 0 0 8px; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 6px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); }
.pair {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--panel);
  font-family: var(--font-mono);
  min-width: 0;
}
.pair .f { color: var(--muted); }
.pair .a { color: var(--muted); font-size: 0.75rem; }
.pair .t { font-weight: 500; overflow-wrap: anywhere; text-align: right; }
.seq { margin: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); font: 1rem/1.7 var(--font-mono); overflow-wrap: anywhere; }
.special { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 6px; font-size: 0.9375rem; }
.special code { font-family: var(--font-mono); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Переводчик Бартанского языка</h1>
  </header>

  <div class="modes" role="group" aria-label="Направление перевода">
    <button class="mode" type="button" id="m-to" aria-pressed="true">На бартанский</button>
    <button class="mode" type="button" id="m-from" aria-pressed="false">С бартанского</button>
  </div>

  <section class="field">
    <div class="row">
      <label class="lab" for="src" id="src-label">Ваш текст</label>
      <div class="tools"><button class="btn" type="button" id="clear">Очистить</button></div>
    </div>
    <div class="frame">
      <textarea id="src" spellcheck="false" autocomplete="off" autocapitalize="off" aria-describedby="hint">Привет, мир! Это моя соль.
Стон 12 мам, Анна</textarea>
    </div>
    <p class="hint" id="hint">Начальный текст служит примером. Сотрите его и пишите своё. Каждый абзац переводится отдельно.</p>
  </section>

  <section class="field">
    <div class="row">
      <span class="lab" id="dst-label">Перевод</span>
      <div class="tools">
        <span class="status" id="status" role="status" aria-live="polite"></span>
        <button class="btn primary" type="button" id="copy">Копировать</button>
      </div>
    </div>
    <div class="out" id="dst" role="region" aria-labelledby="dst-label" data-ph="Здесь появится перевод"></div>
    <p class="hint" id="hint2" hidden>Знак вопроса значит, что однозначно угадать букву нельзя. Остальные символы убраны.</p>
  </section>

  <section class="field" id="en-box" hidden>
    <div class="row">
      <span class="lab" id="dst2-label">English</span>
      <div class="tools"><button class="btn primary" type="button" id="copy2">Копировать</button></div>
    </div>
    <div class="out" id="dst2" role="region" aria-labelledby="dst2-label" data-ph="Translation appears here"></div>
  </section>
</div>

<script>

function lookupEmoji(tok) {
  const cps = [...tok];
  if (cps.length === 2 && cps.every((c) => /\p{Regional_Indicator}/u.test(c))) {
    const code = cps.map((c) => String.fromCharCode(65 + c.codePointAt(0) - 0x1F1E6)).join('');
    return COUNTRIES[code] ? { name: COUNTRIES[code] } : null;
  }
  const full = norm(tok);
  if (LITERAL[full]) return { lit: LITERAL[full] };
  const k = full.replace(/[\u{1F3FB}-\u{1F3FF}]/gu, '');
  for (const t of [k, k.replace(/♀/g, '♂'), k.replace(/‍[♀♂]/g, '')]) {
    if (LITERAL[t]) return { lit: LITERAL[t] };
  }
  const base = [...k][0];
  if (LITERAL[base]) return { lit: LITERAL[base] };
  if (RU[k]) return { name: RU[k] };
  if (RU[base]) return { name: RU[base] };
  if (EMOJI_EN[base]) return { name: EMOJI_EN[base] };
  return null;
}

        if (has(SYMBOLS, key)) { symbol(key); continue; }
        const sq = squaredText(key);
        if (sq !== null) {
          const at0 = items.length, before0 = starts.length;
          if (/^[A-Za-z0-9!]+$/.test(sq)) run(sq, { lead: -1, end: -1, lowerFirst: false });
          else for (const ch of sq) items.push({ s: ch, w: -1 });
          const n0 = state.emojis++;
          items.push({ s: EMO_ARROWS[Math.min(n0, 3)], w: -1 });
          for (const d of String(n0 + 1)) items.push({ s: d, w: -1 });
          starts.length = before0;
          starts.push(at0);
          continue;
        }
        const found = lookupEmoji(m[1]);
        const at = items.length;
        const before = starts.length;
        if (!found) { items.push({ s: '>', w: -1 }); starts.push(at); continue; }
        if (found.lit) pushLit(found.lit, atStart);
        else run(cleanName(found.name), { lead: -1, end: -1, lowerFirst: !atStart });
        const n = state.emojis++;
        items.push({ s: EMO_ARROWS[Math.min(n, 3)], w: -1 });
        for (const d of String(n + 1)) items.push({ s: d, w: -1 });
        starts.length = before;
        starts.push(at);
      } else if (m[2]) {
        const id = (join && join.end === m.index && join.id >= 0) ? join.id : wordId++;
        const lowerFirstWord = ctx.lowerFirst && firstWord;
        firstWord = false;
        const raw = [...m[2]];
        const letters = raw.map((ch) => ({ k: fold(ch).toLowerCase(), up: ch !== ch.toLowerCase(), def: DEFECT.test(ch) }));
        const nearVowel = (i) =>
          (letters[i - 1] && outVowel(letters[i - 1])) || (letters[i + 1] && outVowel(letters[i + 1]));
        letters.forEach((L, i) => {
          starts.push(items.length);
          const k = L.k;
          const pos = m.index + i;
          const up = i === 0 ? (lowerFirstWord ? false : (needCap || L.up)) : L.up;
          const pick = (pair) => (up ? pair[0] : pair[1]);
          const push = (s) => items.push({ s, w: id });
          if (DEFECT.test(raw[i])) {
            const base = fold(raw[i]);
            push(up ? base.toUpperCase() : base.toLowerCase());
            return;
          }
          if (k === 'ь') { items.push({ s: ')', w: id, soft: true }); return; }
          if (k === 'ё') {
            if (pos === ctx.lead) push('‡');
            push(pick(MAP['ё']));
            if (pos === ctx.end) push('‡');
            return;
          }
          if (k === 'm' || k === 'м') { push(pick(nearVowel(i) ? ['∞', '*'] : ['T', 't'])); return; }
          if (k === 't' || k === 'т') { push(pick(nearVowel(i) ? ['Ŧ', 'T'] : ['M', 'm'])); return; }
          push(MAP[k] ? pick(MAP[k]) : raw[i]);
        });
        needCap = false;
      } else if (m[3]) {
        needCap = false;
        for (const d of m[3]) {
          starts.push(items.length);
          const [text2, soft] = DIGITS[d];
          for (const ch of text2) items.push({ s: ch, w: -1, num: true });
          if (soft) items.push({ s: ')', w: -1, soft: true, num: true });
          items.push({ s: NUMSEQ[Math.min(state.numbers, NUMSEQ.length - 1)], w: -1, num: true });
          state.numbers++;
        }
      } else {
        needCap = /[^\S\r\n]/.test(m[4]);
        const n0 = items.length;
        symbol(m[4]);
        join = null;
        if (items.length < n0 || (has(SYMBOLS, m[4]) && SYMBOLS[m[4]] === ERASE)) {
          const last = items[items.length - 1];
          if (last && last.w >= 0) join = { end: m.index + m[0].length, id: last.w };
        }
      }
    }
  };
  run(par, { lead, end, lowerFirst: false });

  const joined = [];
  for (const it of items) {
    joined.push(it);
    while (joined.length > 1) {
      const a = joined[joined.length - 2], b = joined[joined.length - 1];
      if (a.w === -1 && b.w === -1 && !a.num && !b.num && a.s === b.s && ANGLE[a.s]) {
        joined.length -= 2;
        joined.push({ s: ANGLE[a.s], w: -1 });
      } else break;
    }
  }
  items.length = 0;
  joined.forEach((it, i) => {
    items.push(it);
    if (it.s === '∆' && i > 0) items.push({ s: joined[i - 1].s, w: -1 });
  });

  let lastSoft = -1;
  let softs = 0;
  items.forEach((it, i) => { if (it.soft) { lastSoft = i; softs++; } });
  for (let i = 0; i < lastSoft; i++) {
    const to = INSIDE_PARENS[items[i].s];
    if (to) { items[i].s = to; items[i].br = true; }
  }

  const merged = [];
  for (let i = 0; i < items.length; i++) {
    const a = items[i], b = items[i + 1];
    if (b && a.w >= 0 && a.w === b.w && !a.soft && !b.soft && ((isLetter(a.s) && isLetter(b.s)) || (a.s === ';' && b.s === ';'))) {
      const s = mergePair(a, b);
      if (s) { merged.push({ s, w: a.w, inside: i < lastSoft }); i++; continue; }
    }
    merged.push(a);
  }

  for (const it of merged) {
    if (it.inside && it.s === 'Ŀ') it.s = 'Ľ';
    else if (it.inside && it.s === 'ŀ') it.s = 'ľ';
  }

  if (state.first && merged.length && merged[0].w >= 0) {
    const ascii = (it) => !!it && it.w >= 0 && /^[A-Za-z]$/.test(it.s);
    const [a, b] = merged;
    const code = ascii(a) && ascii(b) && a.w === b.w ? (a.s + b.s).toUpperCase() : '';
    if (FLAGS.has(code)) merged.splice(0, 2, { s: flagOf(code), w: -1, lead: true });
    else if (code === 'TP') merged.splice(0, 2, { s: '🧻', w: -1, lead: true });
    else if (ascii(a) && LETTER_EMOJI[a.s.toLowerCase()]) {
      merged.splice(0, 1, { s: LETTER_EMOJI[a.s.toLowerCase()], w: -1, lead: true });
    }
  }

  if (!merged.length) return '';
  const symItem = (it) => !(it.lead || isLetter(it.s));
  const firstPlain = merged.find((it) => !it.soft);
  const initialSymbol = !!firstPlain && symItem(firstPlain);
  const endSymbol = symItem(merged[merged.length - 1]);

  let out = merged.map((it) => it.s).join('');
  let idx = 0;
  if (initialSymbol) { out = MARKS[0] + out; idx = 1; }
  for (let j = 0; j < softs; j++) {
    out = MARKS[Math.min(idx, MARKS.length - 1)] + '(' + out;
    idx++;
  }
  if (endSymbol) out += '†';
  return out;
}

function translate(text) {
  const state = { numbers: 0, emojis: 0, first: true };
  return text.split(/\r?\n/).map((p, i) => {
    state.first = i === 0;
    return translateParagraph(p, state);
  }).join('\n');
}

/* ===== обратный перевод: с бартанского на русский и английский ===== */
const REV = { ru: {}, en: {} };
for (const [k, pair] of Object.entries(MAP)) {
  const lang = /[a-z]/.test(k) ? 'en' : 'ru';
  pair.forEach((g, slot) => {
    const m = REV[lang][g] || (REV[lang][g] = new Map());
    m.set(k, slot === 0);
  });
}
const REV_DOUBLE = {};
for (const [k, pair] of Object.entries(DOUBLES)) {
  if (k === 'v') { REV_DOUBLE['Ⓥ'] = 'VV'; continue; }
  if (k === 'c') { REV_DOUBLE[pair[0]] = '\uE300'; REV_DOUBLE[pair[1]] = '\uE300'; continue; }
  if (k === 'h') { REV_DOUBLE[pair[0]] = 'HH'; continue; }
  REV_DOUBLE[pair[0]] = k.toUpperCase() + k.toUpperCase();
  REV_DOUBLE[pair[1]] = k + k;
}
REV_DOUBLE['⎨'] = ';;';
REV_DOUBLE['Ľ'] = 'LL'; REV_DOUBLE['ľ'] = 'll';
REV_DOUBLE['Ź'] = 'ŻŻ'; REV_DOUBLE['ź'] = 'żż';
REV_DOUBLE['Ł'] = 'L'; REV_DOUBLE['ł'] = 'l';
REV_DOUBLE['Z'] = 'Ż'; REV_DOUBLE['z'] = 'ż';
REV_DOUBLE['ſ'] = '';
const REV_NUM = /(od[lł]H|d;a|mp[lł]|_eT\?pe|r'm\)|\+ecm\)|Ce\*\)|;oce\*\)|de;'m\)|Hoi\))[¹½⅓¼⅕⅙⅐⅛⅑⅒²⅔⅖⅗⅜⁴⅘⁵⅚⅝⁶⁷⅞⁸⁹⁰ⁿ∅]/g;
const REV_NUMWORD = { 'odlH': '1', 'odłH': '1', 'd;a': '2', 'mpl': '3', 'mpł': '3', '_eT?pe': '4', "r'm)": '5', '+ecm)': '6', 'Ce*)': '7', ';oce*)': '8', "de;'m)": '9', 'Hoi)': '0' };
const REV_VOWEL = (g) => !!g && /^[AEIOUYaeiouy]$/.test(fold(g));

function decodeUnits(units, lang) {
  const out = [];
  units.forEach((u, i) => {
    if (u.lit !== undefined) { out.push(u.lit); return; }
    const g = u.g;
    if (g === 'ь') { if (lang === 'ru') out.push('ь'); return; }
    if (g === '') { out.push('?'); return; }
    const near = () => {
      const a = units[i - 1], b = units[i + 1];
      return (a && a.g && REV_VOWEL(a.g)) || (b && b.g && REV_VOWEL(b.g));
    };
    const L = lang === 'ru' ? ['м', 'т'] : ['m', 't'];
    const cap = (s, up) => (up ? s.toUpperCase() : s);
    if (g === '∞') { out.push(cap(L[0], true)); return; }
    if (g === '*') { out.push(L[0]); return; }
    if (g === 't') { out.push(L[0]); return; }
    if (g === 'Ŧ') { out.push(cap(L[1], true)); return; }
    if (g === 'M') { out.push(cap(L[1], true)); return; }
    if (g === 'm') { out.push(L[1]); return; }
    if (g === 'T') { out.push(near() ? L[1] : cap(L[0], true)); return; }
    const mine = REV[lang][g], other = REV[lang === 'ru' ? 'en' : 'ru'][g];
    if (mine) {
      if (mine.size === 1) { const [[k, up]] = [...mine]; out.push(cap(k, up)); }
      else out.push('?');
    } else if (other) out.push('?');
  });
  return out.join('');
}

function reverseLine(line) {
  let s = line.replace(/[←↑↓→]\d+/g, '');
  s = s.replace(/\p{Regional_Indicator}\p{Regional_Indicator}/gu, (m) => {
    const [a, b] = [...m].map((c) => String.fromCharCode(65 + c.codePointAt(0) - 0x1F1E6));
    return a + b.toLowerCase();
  });
  const LET = { '\u{1F170}': 'A', '\u{1F171}': 'B', '\u{1F62E}': 'O', '✌': 'V', '❌': 'X', '\u{1F9FB}': 'Tp' };
  s = s.replace(/([\u{1F170}\u{1F171}\u{1F62E}✌❌\u{1F9FB}])️?/gu, (m, c) => LET[c]);
  s = s.replace(REV_NUM, (m) => '' + REV_NUMWORD[m.slice(0, -1)]);
  s = s.replace(/[★☆✰♙♘♗♖♕♔♟♞♝♜♛♚≈†‡(︎️]/g, '');
  const words = s.split(/[.\s]+/).filter(Boolean);
  const ru = [], en = [];
  for (const w of words) {
    const units = [];
    for (const ch of w) {
      if (ch === '' || ch === '') { units.push({ mark: ch }); continue; }
      const prev = units[units.length - 1];
      if (prev && prev.mark) { units.pop(); units.push({ lit: prev.mark === '' ? ch : ch }); continue; }
      if (ch === ')') { units.push({ g: 'ь' }); continue; }
      if (Object.prototype.hasOwnProperty.call(REV_DOUBLE, ch)) {
        for (const g of REV_DOUBLE[ch]) units.push({ g });
        continue;
      }
      units.push({ g: ch });
    }
    ru.push(decodeUnits(units, 'ru'));
    en.push(decodeUnits(units, 'en'));
  }
  return { ru: ru.filter(Boolean).join(' '), en: en.filter(Boolean).join(' ') };
}

function reverse(text) {
  const lines = text.split(/\r?\n/).map(reverseLine);
  return { ru: lines.map((l) => l.ru).join('\n'), en: lines.map((l) => l.en).join('\n') };
}

const src = document.getElementById('src');
const dst = document.getElementById('dst');
const dst2 = document.getElementById('dst2');
const status = document.getElementById('status');
let timer = 0;
let mode = 'to';
const SAMPLE_TO = src.value;
const SAMPLE_FROM = 'Rpl;eT.Tłp';

function render() {
  if (mode === 'to') { dst.textContent = translate(src.value); return; }
  const r = reverse(src.value);
  dst.textContent = r.ru;
  dst2.textContent = r.en;
}
function setMode(m) {
  if (m === mode) return;
  const sample = src.value === (mode === 'to' ? SAMPLE_TO : SAMPLE_FROM);
  mode = m;
  const from = m === 'from';
  document.getElementById('m-to').setAttribute('aria-pressed', String(!from));
  document.getElementById('m-from').setAttribute('aria-pressed', String(from));
  document.getElementById('en-box').hidden = !from;
  document.getElementById('hint2').hidden = !from;
  document.getElementById('hint').hidden = from;
  document.getElementById('src-label').textContent = from ? 'Текст на бартанском' : 'Ваш текст';
  document.getElementById('dst-label').textContent = from ? 'По-русски' : 'Перевод';
  dst.dataset.ph = from ? 'Здесь появится русский перевод' : 'Здесь появится перевод';
  if (sample) src.value = from ? SAMPLE_FROM : SAMPLE_TO;
  render();
}
function flash(msg) {
  status.textContent = msg;
  clearTimeout(timer);
  timer = setTimeout(() => { status.textContent = ''; }, 2200);
}
async function copyFrom(el) {
  const text = el.textContent;
  if (!text) { flash('Нечего копировать'); return; }
  try {
    await navigator.clipboard.writeText(text);
    flash('Скопировано');
  } catch (e) {
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    flash('Текст выделен, скопируйте вручную');
  }
}

src.addEventListener('input', render);
document.getElementById('m-to').addEventListener('click', () => setMode('to'));
document.getElementById('m-from').addEventListener('click', () => setMode('from'));
document.getElementById('clear').addEventListener('click', () => { src.value = ''; render(); src.focus(); });
document.getElementById('copy').addEventListener('click', () => copyFrom(dst));
document.getElementById('copy2').addEventListener('click', () => copyFrom(dst2));
render();
</script>
